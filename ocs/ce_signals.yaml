version: 1
base_cadets: 140
sheet_name: "(Fill In) CE & Signals"
# Exact fractions, not rounded decimal ratios. Round UP only after scaling.
# Quantities are the filled booking cells in the reference photos, not Default.
# Date offsets reproduce the reference plan; they are editable assumptions,
# not independently confirmed issue/return policies.
anchors:
  xaw_stores: {pattern: 'PREP FOR XAW|XAW.*STORES', occurrence: first}
  uo: {pattern: '\bUO DRILLS\b', occurrence: first}
  ptco: {pattern: 'PTCO.*TRUNCHEON|TACTICAL SCENARIO TRG', occurrence: first}
  lmg_start: {pattern: '\bLMG\b.*(SDL|F2F|THT|ASR)', occurrence: first}
  lmg_shoot: {pattern: '\bLMG\b.*(QUALIFICATION SHOOT|L/F|LIVE FIRING)', occurrence: last}
  relentless: {pattern: '^EX\.? RELENTLESS(?: WARRIOR)?$', occurrence: first}
  gpmg_shoot: {pattern: '^GPMG (L/F|LF|LIVE FIRING)$', occurrence: last}
  dekitting: {pattern: 'DEKITTING|DE-KITTING', occurrence: last}
windows:
  course: {start: course_start, end: dekitting, end_fallback: course_end, standing: true}
  uoce: {start: xaw_stores, end: ptco, end_offset: 7, requires: [uo]}
  heartlanders: {start: xaw_stores, end: ptco, end_offset: 7}
  field_support: {start: xaw_stores, end: gpmg_shoot, end_offset: 6}
  lmg: {start: lmg_start, start_offset: -1, end: lmg_shoot}
  mcn: {start: lmg_shoot, end: gpmg_shoot, end_offset: 6}
  gpmg: {start: gpmg_shoot, start_offset: -4, end: gpmg_shoot, end_offset: 6}
  diesel: {start: relentless, start_offset: -3, end: gpmg_shoot, end_offset: 4}
items:
